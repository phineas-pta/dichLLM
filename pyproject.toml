[project]
name = "dichLLM"
authors = [{name = "PTA"}]
version = "0.0.1"
description = "test khả năng dịch tiểu thuyết mạng tiếng trung sang tiếng việt dùng open-weight LLM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
	"License :: OSI Approved :: MIT License",
	"Development Status :: 1 - Planning",
	"Environment :: Console",
	"Environment :: GPU :: NVIDIA CUDA :: 13",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: Implementation :: CPython",
	"Operating System :: POSIX :: Linux",
	"Intended Audience :: Developers",
	"Natural Language :: Vietnamese",
	"Topic :: Education :: Testing",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
	"Topic :: Text Processing :: Linguistic",
]
requires-python = ">= 3.14"
dependencies = [
	# "marimo[recommended,lsp]",
	"huggingface_hub",
	"torch",
	"exllamav3",
	# "llama-cpp-python",
	"pandas",
	# "underthesea",
]

[project.urls]
Repository = "https://github.com/phineas-pta/dichLLM"

[tool.uv.sources]
torch = { index = "pytorch" }
exllamav3 = { url = "https://github.com/turboderp-org/exllamav3/releases/download/v1.6.6/exllamav3-1.6.6+cu132.torch2.11.0-cp313-cp313-linux_x86_64.whl" }
# llama-cpp-python = { url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.36-cu132/llama_cpp_python-0.3.36-py3-none-manylinux_2_35_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu134"

[tool.marimo.package_management]
manager = "uv"
